# Audioengine A2+ USB (alsa card 3)
# NOTE: This device enumerates correctly but audio playback fails with "drain timeout"
# on both analog-stereo and pro-audio profiles. Root cause unknown — may be a
# power/hardware issue. Disabled until resolved.
#
# Device is misidentified by udev as "CSRA64210 [TaoTronics Headset BH-22]"
# Vendor: Cambridge Silicon Radio (0x0a12), Product: 0x1243

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-Audioengine_Ltd._Audioengine_2__ABCDEFB1180003-00" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
