# /Users/vitalydruker/.config/tmuxinator/finance.yml

name: finance
root: ~/


windows:
  - main:
      layout: main-vertical
      # Synchronize all panes of this window, can be enabled before or after the pane commands run.
      # 'before' represents legacy functionality and will be deprecated in a future release, in favour of 'after'
      # synchronize: after
      panes:
        - nvim -O "$HOME/notes/personal/3. Responsibilties/finance/Trading Log.md" "$HOME/notes/personal/3. Responsibilties/finance/How to Update GnuCash.md"
  - update-gnucash:
      layout: tiled
      panes:
        - cd "$HOME/Documents/finance/personal/update-gnucash/"; nvim process-files.R
        - cd "$HOME/Documents/finance/personal/update-gnucash/"; yazi;
        - cd "$HOME/Documents/finance/personal/update-gnucash/"; claude;
        - cd "$HOME/Documents/finance/personal/update-gnucash/"
  - twinv:
      layout: tiled
      panes:
        - cd "$HOME/.config/twinv/"; timew wes :lastmonth
        - cd "$HOME/Documents/WES/admin/twinv-invoices/"; source setup.sh
        - cd "$HOME/repos/personal/twinv/" 
        - cd "$HOME/Documents/WES/admin/twinv-invoices/"; source setup.sh
  - config:
      panes: 
        - tmuxinator open finance
        - 

