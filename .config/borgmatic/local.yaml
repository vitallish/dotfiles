# https://torsion.org/borgmatic/docs/how-to/provide-your-passwords/
# update this to not be plain text
encryption_passcommand: pass borgmatic/encryption_passphrase
# this was needed when I renamed the path
relocated_repo_access_is_ok: true
source_directories:
  - /home/vitalydruker/Documents
  - /home/vitalydruker/repos/
  - /home/vitalydruker/Desktop/
  - /home/vitalydruker/.ssh
  - /home/vitalydruker/.config/
  - /home/vitalydruker/notes/
  - /home/vitalydruker/scripts/
  - /home/vitalydruker/bin/
  - /home/vitalydruker/.local/share/task/
  - /home/vitalydruker/.local/share/timewarrior/
  - /home/vitalydruker/syncthing-phone/

repositories:
    # The local path or Borg URL of the repository.
    - path: /mnt/internal_backup/borg/thebeef
      label: local
exclude_if_present:
    - .nobackup
keep_hourly: 24
keep_daily: 7
# Number of weekly archives to keep.
keep_weekly: 4
# Number of monthly archives to keep.
keep_monthly: 12
# Number of yearly archives to keep.
keep_yearly: 5


healthchecks:
  ping_url: https://hc-ping.com/9dc98e19-a1b0-474f-988d-aad698b76eee


